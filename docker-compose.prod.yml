services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: JSO
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - jso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - jso-internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      Database__Provider: postgres
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=JSO;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      Payments__PublicBaseUrl: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      Payments__Flouci__AppToken: ${Payments__Flouci__AppToken:-}
      Payments__Flouci__AppSecret: ${Payments__Flouci__AppSecret:-}
      Payments__Flouci__WebhookSecret: ${Payments__Flouci__WebhookSecret:-}
      Payments__Stripe__SecretKey: ${Payments__Stripe__SecretKey:-}
      Payments__Stripe__WebhookSecret: ${Payments__Stripe__WebhookSecret:-}
      Payments__Stripe__TndToStripeRate: ${Payments__Stripe__TndToStripeRate:-0.30}
      # Social publishing (optional). PublicSiteUrl is reused from PUBLIC_ORIGIN
      # so shareable article links are correct even without a Facebook token.
      # Auto-posting to the club's Facebook Page only activates when PAGE_ID and
      # PAGE_ACCESS_TOKEN are supplied; otherwise the admin falls back to manual sharing.
      Social__PublicSiteUrl: ${PUBLIC_ORIGIN}
      Social__Facebook__PageId: ${FACEBOOK_PAGE_ID:-}
      Social__Facebook__PageAccessToken: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
    volumes:
      - jso-media-data:/app/uploads
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - jso-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - jso-internal

volumes:
  jso-postgres-data:
  jso-media-data:

networks:
  jso-internal:
    driver: bridge
