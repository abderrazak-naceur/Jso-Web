services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: JSO
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - jso-postgres-data:/var/lib/postgresql/data
    networks:
      - jso-internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_SECRET:?Set JWT_SECRET}
      Database__Provider: postgres
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=JSO;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    volumes:
      - jso-media-data:/app/uploads
    expose:
      - "8080"
    depends_on:
      - database
    networks:
      - jso-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - jso-internal

volumes:
  jso-postgres-data:
  jso-media-data:

networks:
  jso-internal:
    driver: bridge
