name: JSO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm run lint

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in deploy/oracle/*.sh; do bash -n "$script"; done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/src/JSO.Api/JSO.Api.csproj
      - run: dotnet build backend/src/JSO.Api/JSO.Api.csproj --configuration Release --no-restore
      - name: Run backend unit tests
        run: dotnet test backend/tests/JSO.Api.Tests/JSO.Api.Tests.csproj --configuration Release

  postgres-ef:
    name: PostgreSQL EF validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: JSO
          POSTGRES_USER: jso
          POSTGRES_PASSWORD: jso_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jso -d JSO"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.*
      - name: Restore
        run: dotnet restore backend/src/JSO.Api/JSO.Api.csproj
      - name: Build
        run: dotnet build backend/src/JSO.Api/JSO.Api.csproj --configuration Release --no-restore
      - name: Apply checked-in PostgreSQL migration
        working-directory: backend
        env:
          Database__Provider: postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=JSO;Username=jso;Password=jso_ci_password;Ssl Mode=Disable
        run: dotnet ef database update --project src/JSO.Infrastructure --startup-project src/JSO.Infrastructure --configuration Release --no-build
      - name: Validate applied schema
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: JSO
          PGUSER: jso
          PGPASSWORD: jso_ci_password
        run: |
          set -euo pipefail

          # Number of checked-in PostgreSQL migrations that should have been applied.
          expected_migrations=$(ls backend/src/JSO.Infrastructure/Migrations/Postgres/*.cs \
            | grep -v -E 'Designer\.cs$|ModelSnapshot\.cs$' | wc -l | tr -d ' ')
          echo "Expected migrations: $expected_migrations"

          applied_migrations=$(psql -tA -c \
            'SELECT COUNT(*) FROM "__EFMigrationsHistory";')
          echo "Applied migrations:  $applied_migrations"
          test "$applied_migrations" = "$expected_migrations"

          # Every checked-in migration id must be present in the history table.
          for f in backend/src/JSO.Infrastructure/Migrations/Postgres/*.cs; do
            case "$f" in
              *Designer.cs|*ModelSnapshot.cs) continue ;;
            esac
            id=$(basename "$f" .cs)
            psql -tA -c "SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$id';" \
              | grep -q 1 || { echo "Missing migration in history: $id"; exit 1; }
          done

          # Key tables that must exist after the full migration set is applied.
          for table in AdminUsers Clubs Seasons Competitions Teams Players Matches \
            MatchEvents MatchLineups Sponsors FanUsers Products LiveBlogEntries \
            Volunteers MatchAssignments PlayerInjuries ArchiveItems \
            NewsletterSubscriptions MatchdayChecklistItems MatchdayChecklistTemplateItems \
            SupporterBricks ScoutingNotes Facilities FacilityBookings MaintenanceLogs \
            ClassifiedAds TicketTypes TicketOrders TicketCheckIns StaffAssignments Gates ScannerDevices; do
            psql -tA -c "SELECT to_regclass('public.\"$table\"');" \
              | grep -q "$table" || { echo "Missing expected table: $table"; exit 1; }
          done

          echo "Schema validation passed: $applied_migrations migrations applied, all key tables present."
      - name: Smoke test API and production admin bootstrap
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Database__Provider: postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=JSO;Username=jso;Password=jso_ci_password;Ssl Mode=Disable
          Cors__AllowedOrigins__0: http://localhost:5173
          Jwt__Key: ci-only-jwt-secret-that-is-at-least-32-characters-long
          ADMIN_BOOTSTRAP_EMAIL: admin@jso.test
          ADMIN_BOOTSTRAP_PASSWORD: ci-only-initial-admin-password
        run: |
          dotnet run --project src/JSO.Api --configuration Release --no-build --no-launch-profile > /tmp/jso-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5080/health >/dev/null || { cat /tmp/jso-api.log; exit 1; }
          curl -fsS http://127.0.0.1:5080/api/club >/dev/null
          login_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@jso.test","password":"ci-only-initial-admin-password"}')
          token=$(jq -r '.accessToken // empty' <<< "$login_response")
          test -n "$token"
          admin_id=$(curl -fsS http://127.0.0.1:5080/api/admin/security/users             -H "Authorization: Bearer $token"             | jq -r '.[] | select(.email == "admin@jso.test") | .id' | head -n 1)
          test -n "$admin_id"

          # Admin routes must reject anonymous callers before any data is changed.
          admin_unauth_status=$(curl -sS -o /tmp/jso-admin-unauth.json -w '%{http_code}' \
            http://127.0.0.1:5080/api/admin/matches)
          test "$admin_unauth_status" = 401

          # Browsers must be able to read authorization failures instead of
          # reporting a generic "Failed to fetch" for the donation screens.
          for path in admin/donations/summary staff/donations/cash/capabilities; do
            url="http://127.0.0.1:5080/api/$path"
            preflight_status=$(curl -sS -D /tmp/jso-cors-headers -o /dev/null -w '%{http_code}' \
              -X OPTIONS "$url" -H 'Origin: http://localhost:5173' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type')
            test "$preflight_status" = 204
            grep -iq '^Access-Control-Allow-Origin: http://localhost:5173' /tmp/jso-cors-headers

            unauth_status=$(curl -sS -D /tmp/jso-cors-headers -o /dev/null -w '%{http_code}' \
              "$url" -H 'Origin: http://localhost:5173' \
              -H 'Authorization: Bearer invalid')
            test "$unauth_status" = 401
            grep -iq '^Access-Control-Allow-Origin: http://localhost:5173' /tmp/jso-cors-headers
          done

          # A valid admin without a cash staff assignment receives a readable 403.
          cash_status=$(curl -sS -D /tmp/jso-cors-headers -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:5080/api/staff/donations/cash/capabilities \
            -H 'Origin: http://localhost:5173' -H "Authorization: Bearer $token")
          test "$cash_status" = 403
          grep -iq '^Access-Control-Allow-Origin: http://localhost:5173' /tmp/jso-cors-headers

          # Cash donation: explicit staff grant, receipt, public privacy and revocation.
          cash_assignment=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/staff-assignments \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg adminUserId "$admin_id" \
              '{adminUserId:$adminUserId,role:"TicketSeller",scopeType:"Global",isActive:true}')")
          cash_assignment_id=$(jq -r '.id // empty' <<< "$cash_assignment")
          test -n "$cash_assignment_id"
          curl -fsS http://127.0.0.1:5080/api/staff/donations/cash/capabilities \
            -H "Authorization: Bearer $token" | jq -e '.canCollect == true and (.pointTypes | index("Seller") != null)'

          cash_receipt=$(curl -fsS -X POST http://127.0.0.1:5080/api/staff/donations/cash \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"donorName":"CI Cash Donor","amount":12.34,"pointType":"Seller","pointName":"CI seller","note":"CI private note","whatsappOptIn":false}')
          cash_id=$(jq -r '.id // empty' <<< "$cash_receipt")
          receipt_url=$(jq -r '.receiptUrl // empty' <<< "$cash_receipt")
          test -n "$cash_id" && test "$receipt_url" = "/api/donations/$cash_id/receipt"
          jq -e '.receiptNumber | startswith("JSO-CASH-")' <<< "$cash_receipt"
          curl -fsS "http://127.0.0.1:5080$receipt_url" \
            | jq -e '.amount == 12.34 and .message == null and .donorName == "CI Cash Donor"'
          curl -fsS http://127.0.0.1:5080/api/donations/campaign \
            | jq -e --arg id "$cash_id" 'any(.recentDonations[]; .id == $id and .displayName == "Donateur en espèces" and .message == null)'
          curl -fsS http://127.0.0.1:5080/api/admin/donations/summary \
            -H "Authorization: Bearer $token" \
            | jq -e --arg id "$cash_id" '.cashPaidTnd >= 12.34 and any(.donations[]; .id == $id and .paymentStatus == "Paid")'

          curl -fsS -X DELETE "http://127.0.0.1:5080/api/admin/security/staff-assignments/$cash_assignment_id" \
            -H "Authorization: Bearer $token"
          revoked_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:5080/api/staff/donations/cash/capabilities \
            -H "Authorization: Bearer $token")
          test "$revoked_status" = 403

          # Public donations do not advertise providers without credentials.
          curl -fsS http://127.0.0.1:5080/api/donations/payment-methods \
            | jq -e '.flouci == false and .stripe == false'
          pending_donation=$(curl -fsS -X POST http://127.0.0.1:5080/api/donations \
            -H 'Content-Type: application/json' \
            -d '{"displayName":"CI supporter","amount":10,"whatsAppOptIn":false}')
          pending_id=$(jq -r '.id // empty' <<< "$pending_donation")
          test -n "$pending_id"
          payment_status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "http://127.0.0.1:5080/api/donations/$pending_id/pay" \
            -H 'Content-Type: application/json' -d '{"country":"TN"}')
          test "$payment_status" = 503
          curl -fsS "http://127.0.0.1:5080/api/donations/$pending_id" \
            | jq -e '.paymentStatus == "Pending"'

          season_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/seasons \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke season","isActive":true}')
          season_id=$(jq -r '.id // empty' <<< "$season_response")
          test -n "$season_id"

          competition_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/competitions \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke competition","country":"CI"}')
          competition_id=$(jq -r '.id // empty' <<< "$competition_response")
          test -n "$competition_id"

          team_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/teams \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke team","category":"Senior","isActive":true}')
          team_id=$(jq -r '.id // empty' <<< "$team_response")
          test -n "$season_id" && test -n "$competition_id" && test -n "$team_id"

          match_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/matches \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg seasonId "$season_id" --arg competitionId "$competition_id" --arg teamId "$team_id" \
              '{seasonId:$seasonId,competitionId:$competitionId,teamId:$teamId,opponentName:"CI smoke opponent",kickoffAt:"2030-06-01T15:00:00Z",venue:"CI stadium",isHome:true,homeScore:null,awayScore:null,status:"Scheduled",isPublished:true}')")
          match_id=$(jq -r '.id // empty' <<< "$match_response")
          test -n "$match_id"

          # Staff security resources: provision a gate + scanner device and bind the
          # bootstrapped admin to the CI match. This verifies the production wiring
          # used by the staff scanner without inventing database state outside the API.
          gate_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/gates             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d '{"code":"CI-GATE-01","name":"CI Gate 01","isActive":true}')
          gate_id=$(jq -r '.id // empty' <<< "$gate_response")
          test -n "$gate_id"
          gate_code=$(jq -r '.code // empty' <<< "$gate_response")
          test "$gate_code" = "CI-GATE-01"

          device_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/devices             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "$(jq -nc --arg gateId "$gate_id" '{gateId:$gateId,deviceCode:"CI-SCANNER-01",name:"CI Scanner 01",isActive:true}')")
          device_id=$(jq -r '.id // empty' <<< "$device_response")
          test -n "$device_id"
          device_code=$(jq -r '.deviceCode // empty' <<< "$device_response")
          test "$device_code" = "CI-SCANNER-01"

          assignment_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/staff-assignments             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "$(jq -nc --arg adminId "$admin_id" --arg matchId "$match_id" --arg gateCode "$gate_code" --arg deviceCode "$device_code"               '{adminUserId:$adminId,role:"TicketValidator",scopeType:"Match",scopeId:$matchId,gateId:$gateCode,deviceId:$deviceCode,isActive:true}')")
          assignment_id=$(jq -r '.id // empty' <<< "$assignment_response")
          test -n "$assignment_id"
          jq -e --arg matchId "$match_id" --arg gateCode "$gate_code" --arg deviceCode "$device_code"             '.scopeType == "Match" and .scopeId == $matchId and .gateId == $gateCode and .deviceId == $deviceCode and .role == "TicketValidator"'             <<< "$assignment_response"

          curl -fsS "http://127.0.0.1:5080/api/admin/security/staff-assignments/references"             -H "Authorization: Bearer $token"             | jq -e --arg matchId "$match_id" --arg gateId "$gate_id" --arg deviceId "$device_id"               'any(.matches[]; .id == $matchId) and any(.gates[]; .id == $gateId) and any(.devices[]; .id == $deviceId)'
          curl -fsS http://127.0.0.1:5080/api/matches \
            | jq -e --arg id "$match_id" 'any(.[]; .id == $id and .opponentName == "CI smoke opponent" and .isPublished == true)'

          curl -fsS -X POST http://127.0.0.1:5080/api/admin/news \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI published news","slug":"ci-published-news","body":"Published by the CI smoke test.","status":"Published"}' \
            | jq -e '.slug == "ci-published-news"'
          curl -fsS http://127.0.0.1:5080/api/news/ci-published-news \
            | jq -e '.article.slug == "ci-published-news"'

          upload_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/media/upload \
            -H "Authorization: Bearer $token" \
            -F 'file=@../frontend/public/JSO-crest-regenerated.png;filename=ci-crest.html;type=image/png' \
            -F 'title=CI crest')
          media_url=$(jq -r '.url // empty' <<< "$upload_response")
          test -n "$media_url"
          [[ "$media_url" == *.png ]]
          curl -fsS "http://127.0.0.1:5080$media_url" -o /tmp/jso-upload.png
          test -s /tmp/jso-upload.png
          curl -fsS http://127.0.0.1:5080/api/media \
            | jq -e --arg url "$media_url" 'any(.[]; .url == $url)'

          printf 'this is not an image' > /tmp/jso-invalid-image.txt
          invalid_status=$(curl -sS -o /tmp/jso-invalid-response.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/media/upload \
            -H "Authorization: Bearer $token" \
            -F 'file=@/tmp/jso-invalid-image.txt;filename=forged.png;type=image/png')
          test "$invalid_status" = 400

          # Sponsors: anonymous admin call rejected, then create + public visibility by placement.
          sponsor_unauth_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/sponsors)
          test "$sponsor_unauth_status" = 401

          sponsor_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/sponsors \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke sponsor","tier":"Partner","placement":"Footer","isActive":true,"priority":10,"startDate":"2020-01-01T00:00:00Z","endDate":"2035-01-01T00:00:00Z"}')
          sponsor_id=$(jq -r '.id // empty' <<< "$sponsor_response")
          test -n "$sponsor_id"

          # Public endpoint returns it for its placement...
          curl -fsS 'http://127.0.0.1:5080/api/sponsors?placement=Footer' \
            | jq -e --arg id "$sponsor_id" 'any(.[]; .id == $id and .name == "CI smoke sponsor")'
          # ...and does NOT return it for a different placement.
          curl -fsS 'http://127.0.0.1:5080/api/sponsors?placement=Home' \
            | jq -e --arg id "$sponsor_id" 'all(.[]; .id != $id)'

          # Fan account: register -> login -> me, and a Fan token must NOT reach admin routes.
          fan_email="ci-fan-$RANDOM@jso.test"
          fan_pass="ci-fan-secret-$RANDOM$RANDOM"
          fan_reg=$(curl -fsS -X POST http://127.0.0.1:5080/api/account/register \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "$fan_email" --arg p "$fan_pass" '{email:$e,displayName:"CI Fan",password:$p}')")
          fan_token=$(jq -r '.accessToken // empty' <<< "$fan_reg")
          test -n "$fan_token"

          fan_login=$(curl -fsS -X POST http://127.0.0.1:5080/api/account/login \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "$fan_email" --arg p "$fan_pass" '{email:$e,password:$p}')")
          fan_token=$(jq -r '.accessToken // empty' <<< "$fan_login")
          test -n "$fan_token"

          curl -fsS http://127.0.0.1:5080/api/account/me \
            -H "Authorization: Bearer $fan_token" \
            | jq -e --arg e "$fan_email" '.email == $e'

          # Ticketing + staff scanner E2E: reserve -> confirm -> digital token -> validate/check-in.
          ticket_type_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/tickets/types \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg matchId "$match_id" '{matchId:$matchId,name:"CI General Admission",price:10,currency:"TND",capacity:20,isActive:true}')")
          ticket_type_id=$(jq -r '.id // empty' <<< "$ticket_type_response")
          test -n "$ticket_type_id"

          reserve_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/tickets/reserve \
            -H "Authorization: Bearer $fan_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg ticketTypeId "$ticket_type_id" '{ticketTypeId:$ticketTypeId,quantity:1}')")
          ticket_order_id=$(jq -r '.id // empty' <<< "$reserve_response")
          test -n "$ticket_order_id"

          curl -fsS -X PUT "http://127.0.0.1:5080/api/admin/tickets/orders/$ticket_order_id/status" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"status":"Confirmed"}' \
            | jq -e '.status == "Confirmed"'

          digital_response=$(curl -fsS "http://127.0.0.1:5080/api/tickets/$ticket_order_id/digital" \
            -H "Authorization: Bearer $fan_token")
          ticket_token=$(jq -r '.token // empty' <<< "$digital_response")
          test -n "$ticket_token"
          jq -e --arg matchId "$match_id" '.matchId == $matchId and .status == "Confirmed"' <<< "$digital_response"

          # Correct match/gate/device: validation succeeds, then the first check-in succeeds.
          validate_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:$deviceId}')")
          jq -e '.result == "Valid"' <<< "$validate_response"

          checkin_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/tickets/scan/check-in \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:$deviceId}')")
          jq -e '.result == "Valid" and .ticket.status == "CheckedIn"' <<< "$checkin_response"

          # Second scan must never grant entry again.
          second_checkin=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/tickets/scan/check-in \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:$deviceId}')")
          jq -e '.result == "AlreadyUsed"' <<< "$second_checkin"

          # Wrong match is a ticket outcome, while wrong gate/device are authorization failures.
          wrong_match_status=$(curl -sS -o /tmp/jso-wrong-match.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:"00000000-0000-0000-0000-000000000001",gateId:$gateId,deviceId:$deviceId}')")
          test "$wrong_match_status" = 200
          jq -e '.result == "WrongMatch"' /tmp/jso-wrong-match.json

          wrong_gate_status=$(curl -sS -o /tmp/jso-wrong-gate.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:"CI-WRONG-GATE",deviceId:$deviceId}')")
          test "$wrong_gate_status" = 403

          wrong_device_status=$(curl -sS -o /tmp/jso-wrong-device.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:"CI-WRONG-DEVICE"}')")
          test "$wrong_device_status" = 403

          # Remove the live assignment, then verify expired and inactive assignments are denied.
          curl -fsS -X DELETE "http://127.0.0.1:5080/api/admin/security/staff-assignments/$assignment_id" \
            -H "Authorization: Bearer $token" >/dev/null

          expired_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/staff-assignments \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg adminId "$admin_id" --arg matchId "$match_id" --arg gateCode "$gate_code" --arg deviceCode "$device_code"               '{adminUserId:$adminId,role:"TicketValidator",scopeType:"Match",scopeId:$matchId,isActive:true,validFrom:"2019-01-01T00:00:00Z",validTo:"2020-01-01T00:00:00Z"}')")
          expired_assignment_id=$(jq -r '.id // empty' <<< "$expired_response")
          test -n "$expired_assignment_id"
          expired_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:$deviceId}')")
          test "$expired_status" = 403

          curl -fsS -X DELETE "http://127.0.0.1:5080/api/admin/security/staff-assignments/$expired_assignment_id" \
            -H "Authorization: Bearer $token" >/dev/null
          inactive_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/security/staff-assignments \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg adminId "$admin_id" --arg matchId "$match_id" --arg gateCode "$gate_code" --arg deviceCode "$device_code"               '{adminUserId:$adminId,role:"TicketValidator",scopeType:"Match",scopeId:$matchId,isActive:false}')")
          inactive_assignment_id=$(jq -r '.id // empty' <<< "$inactive_response")
          test -n "$inactive_assignment_id"
          inactive_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/tickets/scan/validate \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$ticket_token" --arg matchId "$match_id" --arg gateId "$gate_code" --arg deviceId "$device_code"               '{token:$token,matchId:$matchId,gateId:$gateId,deviceId:$deviceId}')")
          test "$inactive_status" = 403

          # Anti-escalation: a Fan token is rejected (401/403) on an admin route.
          fan_admin_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $fan_token" \
            http://127.0.0.1:5080/api/admin/sponsors)
          test "$fan_admin_status" = 401 -o "$fan_admin_status" = 403

  mobile:
    name: Mobile Flutter validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test
