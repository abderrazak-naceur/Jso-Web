name: JSO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/oracle/backup.sh deploy/oracle/deploy.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/src/JSO.Api/JSO.Api.csproj
      - run: dotnet build backend/src/JSO.Api/JSO.Api.csproj --configuration Release --no-restore

  postgres-ef:
    name: PostgreSQL EF validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: JSO
          POSTGRES_USER: jso
          POSTGRES_PASSWORD: jso_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jso -d JSO"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.*
      - name: Restore
        run: dotnet restore backend/src/JSO.Api/JSO.Api.csproj
      - name: Build
        run: dotnet build backend/src/JSO.Api/JSO.Api.csproj --configuration Release --no-restore
      - name: Apply checked-in PostgreSQL migration
        working-directory: backend
        env:
          Database__Provider: postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=JSO;Username=jso;Password=jso_ci_password
        run: dotnet ef database update --project src/JSO.Infrastructure --startup-project src/JSO.Infrastructure --configuration Release --no-build
      - name: Smoke test API and production admin bootstrap
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Database__Provider: postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=JSO;Username=jso;Password=jso_ci_password
          Cors__AllowedOrigins__0: http://localhost:5173
          Jwt__Key: ci-only-jwt-secret-that-is-at-least-32-characters-long
          ADMIN_BOOTSTRAP_EMAIL: admin@jso.test
          ADMIN_BOOTSTRAP_PASSWORD: ci-only-initial-admin-password
        run: |
          dotnet run --project src/JSO.Api --configuration Release --no-build --no-launch-profile > /tmp/jso-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5080/health >/dev/null || { cat /tmp/jso-api.log; exit 1; }
          curl -fsS http://127.0.0.1:5080/api/club >/dev/null
          login_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@jso.test","password":"ci-only-initial-admin-password"}')
          token=$(jq -r '.accessToken // empty' <<< "$login_response")
          test -n "$token"

          curl -fsS -X POST http://127.0.0.1:5080/api/admin/news \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI published news","slug":"ci-published-news","body":"Published by the CI smoke test.","status":"Published"}' \
            | jq -e '.slug == "ci-published-news"'
          curl -fsS http://127.0.0.1:5080/api/news/ci-published-news \
            | jq -e '.article.slug == "ci-published-news"'

          upload_response=$(curl -fsS -X POST http://127.0.0.1:5080/api/admin/media/upload \
            -H "Authorization: Bearer $token" \
            -F 'file=@../public/JSO-crest-regenerated.png;filename=ci-crest.html;type=image/png' \
            -F 'title=CI crest')
          media_url=$(jq -r '.url // empty' <<< "$upload_response")
          test -n "$media_url"
          [[ "$media_url" == *.png ]]
          curl -fsS "http://127.0.0.1:5080$media_url" -o /tmp/jso-upload.png
          test -s /tmp/jso-upload.png
          curl -fsS http://127.0.0.1:5080/api/media \
            | jq -e --arg url "$media_url" 'any(.[]; .url == $url)'

          printf 'this is not an image' > /tmp/jso-invalid-image.txt
          invalid_status=$(curl -sS -o /tmp/jso-invalid-response.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/admin/media/upload \
            -H "Authorization: Bearer $token" \
            -F 'file=@/tmp/jso-invalid-image.txt;filename=forged.png;type=image/png')
          test "$invalid_status" = 400
