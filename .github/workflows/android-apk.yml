name: JSO Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK for Render API
        run: >-
          flutter build apk --release
          --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api
          --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSO-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: JSO Android APK (latest)
          body: Latest automatically built Android APK for JSO.
          target_commitish: main
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          prerelease: true
          make_latest: false
