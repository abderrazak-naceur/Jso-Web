name: JSO Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate JSO launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate branded native splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK for Render API
        run: >-
          flutter build apk --release
          --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api
          --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JSO-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-apk:
    name: Publish versioned Android APK
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JSO-Android-APK
          path: release
      - name: Publish versioned APK release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: JSO Android APK ${{ github.ref_name }}
          body: Android APK built from the tagged JSO source release.
          files: release/app-release.apk
          prerelease: true
          make_latest: false
