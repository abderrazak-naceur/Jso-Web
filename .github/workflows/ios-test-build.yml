name: JSO iOS Test Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-test-build.yml'

permissions:
  contents: write
  actions: read

jobs:
  build-ios:
    name: Build iOS test packages
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS IPA
        run: >-
          flutter build ipa --release --no-codesign
          --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api

      - name: Package iOS Simulator app
        run: |
          flutter build ios --simulator --release --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app JSO-iOS-Simulator.zip

      - name: Name IPA for release
        run: cp build/ios/ipa/*.ipa build/ios/ipa/JSO-iOS-unsigned.ipa

      - name: Upload iOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JSO-iOS-Test-Builds
          path: |
            mobile/build/ios/ipa/JSO-iOS-unsigned.ipa
            mobile/build/ios/iphonesimulator/JSO-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish iOS test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: JSO iOS Test Build (unsigned)
          body: |
            iOS test build for JSO.

            IMPORTANT: JSO-iOS-unsigned.ipa is not signed and cannot be installed directly on a physical iPhone. Installation on a physical iPhone requires valid Apple signing/provisioning (typically Apple Developer + TestFlight or an Ad Hoc profile). JSO-iOS-Simulator.zip is intended for the iOS Simulator on a Mac with Xcode; it does not run on Windows.
          target_commitish: main
          files: |
            mobile/build/ios/ipa/JSO-iOS-unsigned.ipa
            mobile/build/ios/iphonesimulator/JSO-iOS-Simulator.zip
          overwrite_files: true
          prerelease: true
          make_latest: false
