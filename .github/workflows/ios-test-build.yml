name: JSO iOS Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-test-build.yml'
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read
  actions: read

jobs:
  build-ios:
    name: Build iOS test packages
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate JSO launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate branded native splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS archive
        run: >-
          flutter build ipa --release --no-codesign
          --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api
          --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com

      - name: Package unsigned Xcode archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/ios/archive/*.xcarchive)
          test ${#archives[@]} -gt 0
          ditto -c -k --sequesterRsrc --keepParent "${archives[0]}" build/ios/archive/JSO-iOS-unsigned.xcarchive.zip

      - name: Package iOS Simulator app
        run: |
          flutter build ios --simulator --debug --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app JSO-iOS-Simulator.zip
          mkdir -p ../release
          cp ../archive/JSO-iOS-unsigned.xcarchive.zip ../release/
          cp JSO-iOS-Simulator.zip ../release/

      - name: Upload iOS test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JSO-iOS-Test-Builds
          path: mobile/build/ios/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-ios:
    name: Publish versioned iOS test build
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download iOS test artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JSO-iOS-Test-Builds
          path: release
      - name: Publish versioned iOS test release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: JSO iOS Test Build ${{ github.ref_name }} (unsigned archive)
          body: |
            iOS test build for JSO.

            JSO-iOS-unsigned.xcarchive.zip contains an unsigned Xcode archive. Sign and export it with a valid Apple provisioning profile to create an installable IPA for a physical iPhone. JSO-iOS-Simulator.zip is a debug build for the iOS Simulator on a Mac with Xcode; it does not run on a physical iPhone.
          files: |
            release/JSO-iOS-unsigned.xcarchive.zip
            release/JSO-iOS-Simulator.zip
          prerelease: true
          make_latest: false
