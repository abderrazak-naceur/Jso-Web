name: JSO iOS Test Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-test-build.yml'

permissions:
  contents: write
  actions: read

jobs:
  build-ios:
    name: Build iOS test packages
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS archive
        run: >-
          flutter build ipa --release --no-codesign
          --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api
          --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com

      - name: Package unsigned Xcode archive
        run: |
          set -euo pipefail
          source_archive="$(find build/ios/archive -maxdepth 1 -type d -name '*.xcarchive' -print -quit)"
          test -n "$source_archive"
          ditto -c -k --sequesterRsrc --keepParent "$source_archive" build/ios/archive/JSO-iOS-unsigned.xcarchive.zip

      - name: Package iOS Simulator app
        run: |
          flutter build ios --simulator --debug --dart-define=JSO_API_BASE_URL=https://jso-api.onrender.com/api --dart-define=JSO_WEB_BASE_URL=https://jso-web.onrender.com
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app JSO-iOS-Simulator.zip

      - name: Upload iOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JSO-iOS-Test-Builds
          path: |
            mobile/build/ios/archive/JSO-iOS-unsigned.xcarchive.zip
            mobile/build/ios/iphonesimulator/JSO-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish iOS test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: JSO iOS Test Build (unsigned archive)
          body: |
            iOS test build for JSO.

            JSO-iOS-unsigned.xcarchive.zip contains an unsigned Xcode archive. Sign and export it with a valid Apple provisioning profile to create an installable IPA for a physical iPhone. JSO-iOS-Simulator.zip is a debug build for the iOS Simulator on a Mac with Xcode; it does not run on a physical iPhone.
          target_commitish: main
          files: |
            mobile/build/ios/archive/JSO-iOS-unsigned.xcarchive.zip
            mobile/build/ios/iphonesimulator/JSO-iOS-Simulator.zip
          overwrite_files: true
          prerelease: true
          make_latest: false
