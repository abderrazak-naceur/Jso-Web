name: EF Probe

on:
  push:
    branches:
      - fix/ci-postgres-migrations

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: JSO
          POSTGRES_USER: jso
          POSTGRES_PASSWORD: jso_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jso -d JSO"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/src/JSO.Api/JSO.Api.csproj
      - run: dotnet build backend/src/JSO.Api/JSO.Api.csproj --configuration Release --no-restore
      - name: Generate probe migration
        working-directory: backend
        env:
          Database__Provider: postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=JSO;Username=jso;Password=jso_ci_password
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add CiPendingProbe --project src/JSO.Infrastructure --startup-project src/JSO.Infrastructure --configuration Release --output-dir /tmp/probe --no-build
          find /tmp/probe -type f -maxdepth 1 -print -exec sed -n '1,260p' {} \;
