name: Normalize player portraits

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-player-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert WebP portraits to optimized PNG
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("frontend/public/players")
          for src in sorted(root.glob("*.webp")):
              dst = src.with_suffix(".png")
              with Image.open(src) as image:
                  rgba = image.convert("RGBA")
                  rgba.save(dst, format="PNG", optimize=True)
              print(f"{src.name} -> {dst.name}")
          PY

      - name: Commit generated PNG portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/players/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit."
            exit 0
          fi
          git commit -m "chore(assets): add PNG player portraits"
          git push
