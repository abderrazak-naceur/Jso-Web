name: tmp-dart-format
on:
  push:
    branches: [fix/mobile-dart-format]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: dart format lib
        working-directory: mobile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git add mobile/lib && git commit -m "style(mobile): dart format lib" && git push; }
