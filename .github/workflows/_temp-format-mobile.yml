name: Temporary mobile formatter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format-mobile:
    if: github.event.pull_request.head.ref == 'feat/match-stream-promo-codes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Dart source
        run: dart format mobile/lib
      - name: Commit formatter changes
        run: |
          if git diff --quiet -- mobile/lib; then
            echo "Dart files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib
          git commit -m "style(mobile): format Dart source"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
