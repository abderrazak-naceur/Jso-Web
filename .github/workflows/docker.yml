name: JSO Docker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "Dockerfile.frontend"
      - "frontend/**"
      - "deploy/nginx/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "Dockerfile.frontend"
      - "frontend/**"
      - "deploy/nginx/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  frontend-docker:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          load: true
          tags: jso-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 jso-web:ci nginx -t

  backend-docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: jso-api:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
