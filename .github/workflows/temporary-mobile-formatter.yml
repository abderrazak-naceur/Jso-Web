name: Temporary mobile formatter

on:
  push:
    branches:
      - feat/mobile-admin-parity-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-admin-parity-audit
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart sources
        run: dart format mobile/lib
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- mobile/lib; then
            echo "Dart sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib
          git commit -m "style(mobile): format Dart sources"
          git push origin HEAD:feat/mobile-admin-parity-audit
