<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/JSO-official-crest.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JSO" />
    <meta name="description" content="Plateforme digitale officielle de la Jeunesse Sportive de Oudhref : actualités, calendrier et résultats, effectif, médias et boutique du club." />
    <title>JSO — Jeunesse Sportive de Oudhref</title>

    <!-- Canonical + robots. Update the absolute URL to the real domain at
         go-live (see docs/DEPLOY_ORACLE_CLOUD.md). -->
    <link rel="canonical" href="https://jso-web.onrender.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JSO Oudhref" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="JSO — Jeunesse Sportive de Oudhref" />
    <meta property="og:description" content="Plateforme digitale officielle de la Jeunesse Sportive de Oudhref : actualités, calendrier et résultats, effectif, médias et boutique du club." />
    <meta property="og:url" content="https://jso-web.onrender.com/" />
    <meta property="og:image" content="https://jso-web.onrender.com/JSO-official-crest.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Le stade de la Jeunesse Sportive de Oudhref" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSO — Jeunesse Sportive de Oudhref" />
    <meta name="twitter:description" content="Plateforme digitale officielle de la Jeunesse Sportive de Oudhref." />
    <meta name="twitter:image" content="https://jso-web.onrender.com/JSO-official-crest.png?v=2" />

    <!-- Structured data: the sports club identity (schema.org/SportsClub) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsClub",
        "name": "Jeunesse Sportive de Oudhref",
        "alternateName": "JSO",
        "sport": "Football",
        "foundingDate": "1973",
        "url": "https://jso-web.onrender.com/",
        "logo": "https://jso-web.onrender.com/JSO-official-crest.png",
        "image": "https://jso-web.onrender.com/jso-stadium-hero.png",
        "location": {
          "@type": "Place",
          "name": "Stade d’Oudhref",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Oudhref",
            "addressCountry": "TN"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved accessibility preferences (idea G21) before React hydrates
      // to avoid a flash of the default (non-accessible) appearance.
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('jso_a11y_prefs') || 'null') || {};
          var root = document.documentElement;
          if (prefs.highContrast === true) root.classList.add('jso-high-contrast');
          if (prefs.reduceMotion === true) root.classList.add('jso-reduce-motion');
          var sizes = ['normal', 'large', 'xlarge'];
          root.setAttribute('data-jso-text-size', sizes.indexOf(prefs.textSize) >= 0 ? prefs.textSize : 'normal');
        } catch (e) { /* storage unavailable: fall back to defaults */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
